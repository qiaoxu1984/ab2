<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AB2 Manager</title><link rel="stylesheet" href="/static/style.css"><style>.channel-card{display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start}.channel-phase{min-width:0}.phases{display:flex;gap:8px;margin:0}.phase{flex:1;min-width:0;border-radius:8px;padding:10px;background:#374151;border:1px solid #4b5563;display:flex;flex-direction:column;gap:5px}.phase b{font-size:12px;color:#e5e7eb}.phase span{font-size:11px;color:#9ca3af}.phase small{font-size:10px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.phase.running{border-color:#38bdf8;background:#082f49}.phase.success{border-color:#22c55e;background:#14532d}.phase.success span{color:#bbf7d0}.phase.failed{border-color:#ef4444;background:#450a0a}.phase.failed span{color:#fecaca}.phase.skipped{opacity:.55}.phase.skipped span{color:#9ca3af}.report{font-size:10px;padding:3px 6px;background:#38bdf8;border:0;border-radius:4px;cursor:pointer}.task-summary{margin-top:12px;color:#9ca3af;font-size:12px}@media(max-width:900px){.channel-card{grid-template-columns:1fr}.phases{flex-direction:column}.phase small{white-space:normal}}</style></head>
<body><style>main{display:block!important;padding:20px!important}.machine-group{margin:14px 0;border:1px solid #334155;border-radius:10px;background:#111827;overflow:hidden}.machine-group summary{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none}.machine-group summary::-webkit-details-marker{display:none}.machine-group summary:before{content:'+';width:18px;color:#94a3b8;font-size:18px}.machine-group[open] summary:before{content:'−'}.machine-name{font-weight:700;color:#f8fafc}.machine-status{padding:3px 8px;border-radius:999px;font-size:12px}.machine-group.online .machine-status{background:#14532d;color:#bbf7d0}.machine-group.offline .machine-status{background:#450a0a;color:#fecaca}.machine-meta{color:#94a3b8;font-size:12px}.machine-channels{padding:0 14px 14px}.machine-group.offline{opacity:.82}.channel-card{width:100%;display:grid;grid-template-columns:minmax(360px,420px) minmax(760px,1fr);gap:28px;align-items:start}.channel-main{min-width:0}.channel-phase{min-width:0;overflow:hidden}.channel-actions{justify-content:flex-start}.channel-actions .cancel{margin-left:0}.channel-actions button:disabled{cursor:not-allowed;opacity:.65}.phases{width:100%;display:grid!important;grid-template-columns:repeat(5,minmax(135px,1fr));gap:10px;margin:0}.phase{min-width:135px;overflow:hidden}.phase b,.phase span{white-space:nowrap}.phase small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:1250px){.channel-card{grid-template-columns:1fr}.phases{grid-template-columns:repeat(5,minmax(135px,1fr));overflow-x:auto;padding-bottom:8px}}</style><header><h1>AB2 Build Manager</h1><nav class="build-tabs" aria-label="构建类型"><button class="build-tab active" data-build-type="dev" aria-selected="true" onclick="setBuildType('dev')">Dev</button><button class="build-tab" data-build-type="release" aria-selected="false" onclick="setBuildType('release')">Release</button></nav><button id="refresh" class="header-action">刷新</button></header><main><section><h2>渠道构建</h2><div id="agents">加载中...</div></section></main><script src="/static/app.js"></script></body>
</html>
