<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AB2 本机服务</title><style>body{margin:0;background:#0f172a;color:#dbeafe;font:14px system-ui;padding:28px}main{max-width:760px;margin:auto}h1{color:#7dd3fc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px}.state{margin:14px 0;color:#94a3b8}.running{color:#86efac}.stopped{color:#fca5a5}button{border:0;border-radius:6px;padding:9px 14px;margin-right:8px;cursor:pointer;background:#38bdf8}button.stop{background:#64748b;color:#fff}input{width:100%;box-sizing:border-box;margin:5px 0 12px;padding:9px;border:1px solid #475569;border-radius:6px;background:#0f172a;color:#fff}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><h1>AB2 本机服务控制台</h1><p>仅控制当前机器上的 Manager 和 Agent，不执行任意命令。</p><div id="message" class="message">正在连接控制服务...</div><div class="grid"><section class="card"><h2>Manager</h2><div id="manager" class="state">检测中...</div><label>端口<input id="port" value="8000" type="number"></label><button id="managerAction" onclick="toggle('manager')">检测中...</button><button onclick="openManagerPage()">打开 Manager 页面</button></section><section class="card"><h2>Agent</h2><div id="agent" class="state">检测中...</div><label>Manager 地址<input id="managerUrl" value="ws://172.18.67.71:8000/ws/agent"></label><label>配置文件<input id="config" value="data/agent.json"></label><button id="agentAction" onclick="toggle('agent')">检测中...</button><button onclick="openAgentPage()">打开 Agent 配置页</button></section></div></main><script>
const apiBase=location.protocol==='file:'?'http://127.0.0.1:8010':'';
function showMessage(text,error=false){const el=document.querySelector('#message');el.textContent=text;el.className='message '+(error?'error':'');}
async function refresh(){try{const response=await fetch(apiBase+'/api/status');if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();for(const name of ['manager','agent']){const item=data[name];const el=document.querySelector('#'+name);const action=document.querySelector('#'+name+'Action');el.className='state '+(item.running?'running':'stopped');el.textContent=item.running?'运行中 · PID '+item.pid:'未运行';action.textContent=item.running?'停止':'启动';action.className=item.running?'stop':'';}showMessage('控制服务已连接');}catch(error){showMessage('无法连接控制服务，请运行 run_control.bat：'+error.message,true);}}
async function action(name,verb,body={}){try{const response=await fetch(apiBase+'/api/services/'+name+'/'+verb,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(!response.ok||result.ok===false)throw new Error(result.error||'HTTP '+response.status);showMessage(name+' '+(verb==='start'?'启动':'停止')+'请求已执行');await refresh();}catch(error){showMessage('操作失败：'+error.message,true);}}
async function toggle(name){const state=await fetch(apiBase+'/api/status').then(r=>r.json());if(state[name].running){await action(name,'stop');return;}const body=name==='manager'?{port:document.querySelector('#port').value}:{manager:document.querySelector('#managerUrl').value,config:document.querySelector('#config').value};await action(name,'start',body);}
function openAgentPage(){window.open('http://127.0.0.1:8020/','ab2-agent-config');}
function openManagerPage(){const port=document.querySelector('#port').value||8000;window.open('http://127.0.0.1:'+encodeURIComponent(port)+'/','ab2-manager');}
refresh();setInterval(refresh,2000);
</script></body></html>
