<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AB2 Agent 配置</title><style>body{margin:0;background:#0f172a;color:#dbeafe;font:14px system-ui;padding:24px}main{max-width:980px;margin:auto}h1{color:#7dd3fc}.bar,.project,.channel{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#94a3b8}input,select{width:100%;height:42px;box-sizing:border-box;margin:5px 0 0;padding:9px;background:#0f172a;border:1px solid #475569;border-radius:5px;color:#fff}.channel-row{display:flex;align-items:flex-end;gap:14px}.channel-control{margin:0}.switch-control{flex:0 0 210px}.method-control{flex:1 1 auto}.channel-delete{height:42px;white-space:nowrap;margin:0 0 0 0}.channel{padding:14px}.channel-row button{margin:0}button{border:0;border-radius:5px;padding:8px 14px;margin:4px;background:#38bdf8;cursor:pointer}.danger{background:#ef4444;color:#fff}.muted{color:#94a3b8}.message{padding:10px;border-radius:6px;background:#172554}.error{background:#450a0a;color:#fecaca}@media(max-width:700px){.grid{grid-template-columns:1fr}.channel-row{align-items:stretch;flex-direction:column;gap:8px}.switch-control,.method-control{flex:auto}.channel-delete{width:max-content}}</style></head>
<body><main><h1>AB2 Agent 配置</h1><p class="muted">配置保存在本机，Agent 会通过心跳同步给 Manager。</p><div id="message" class="message">加载中...</div><section class="bar"><div class="grid"><label>Agent ID<input id="agentId"></label><label>Agent 名称<input id="agentName"></label></div></section><div id="projects"></div><button onclick="addProject()">+ 添加 Unity 工程</button><button onclick="save()">保存配置</button></main><script>
let config={id:'',name:'',projects:[]};
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function addProject(){try{const result=await fetch('/api/select-folder',{method:'POST'}).then(r=>r.json());if(result.cancelled)return;if(!result.ok)throw new Error(result.error);config.projects.push(result.project);render();show('已读取 Unity 工程状态，请补充渠道配置');}catch(error){show('选择工程失败：'+error.message,true);}}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='ab2-project-selected')return;config.projects.push(event.data.project);render();show('已读取 Unity 工程状态，请补充渠道配置');});
function addChannel(projectIndex){const p=config.projects[projectIndex];const platform=(p.platforms||['Unknown'])[0];const prefix={Android:'android',iOS:'ios',HarmonyOS:'harmony'}[platform]||'unknown';config.projects[projectIndex].channels.push({name:prefix+'_dev',platform:platform,switch_to:prefix+'_dev',branch_filter:'all_dev',build_method:'HLS_Editor.ExportEditor.BuildFromAB2',enabled:true});render();}
function removeProject(index){config.projects.splice(index,1);render();}
function removeChannel(projectIndex,channelIndex){config.projects[projectIndex].channels.splice(channelIndex,1);render();}
function render(){document.querySelector('#agentId').value=config.id||'';document.querySelector('#agentName').value=config.name||'';document.querySelector('#projects').innerHTML=config.projects.map((p,i)=>`<section class="project"><h2>Unity 工程 ${i+1}</h2><div class="grid"><label>名称<input data-p="${i}" data-k="name" value="${esc(p.name)}"></label><label>工程路径<input data-p="${i}" data-k="path" value="${esc(p.path)}" placeholder="D:/Projects/Game"></label><label>Unity 路径<input value="${esc(p.unity_path)}" readonly></label><label>平台<input value="${esc((p.platforms||['Unknown'])[0])}" readonly></label><label>日志路径<input data-p="${i}" data-k="log_path" value="${esc(p.log_path)}"></label><label>默认分支<input data-p="${i}" data-k="default_branch" value="${esc(p.default_branch)}"></label></div><h3>渠道</h3>${p.channels.map((c,j)=>{const prefix={Android:'android',iOS:'ios',HarmonyOS:'harmony'}[c.platform]||'unknown';const switchTo=c.switch_to||prefix+'_dev';return `<div class="channel-row"><label class="channel-control switch-control">SwitchTo<select data-p="${i}" data-c="${j}" data-k="switch_to"><option value="${prefix}_dev" ${switchTo===prefix+'_dev'?'selected':''}>${prefix}_dev</option><option value="${prefix}_release" ${switchTo===prefix+'_release'?'selected':''}>${prefix}_release</option></select></label><label class="channel-control method-control">打包方法<input data-p="${i}" data-c="${j}" data-k="build_method" value="${esc(c.build_method)}"></label><button class="danger channel-delete" onclick="removeChannel(${i},${j})">删除渠道</button></div>`}).join('')}<button onclick="addChannel(${i})">+ 添加渠道</button><button class="danger" onclick="removeProject(${i})">删除工程</button></section>`).join('');document.querySelectorAll('[data-p]').forEach(input=>input.oninput=()=>{const p=config.projects[Number(input.dataset.p)];if(input.dataset.c===undefined)p[input.dataset.k]=input.value;else p.channels[Number(input.dataset.c)][input.dataset.k]=input.value;});}
const baseRender=render;
render=function(){normalizeHarmony();baseRender();document.querySelectorAll('.channel-row').forEach(row=>{const source=row.querySelector('[data-k="build_method"]');const projectIndex=Number(source.dataset.p);const channelIndex=Number(source.dataset.c);const select=document.createElement('select');select.dataset.p=projectIndex;select.dataset.c=channelIndex;select.dataset.k='branch_filter';['all_dev','all_feature','month_dev','month_feature'].forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;option.selected=(config.projects[projectIndex].channels[channelIndex].branch_filter||'all_dev')===value;select.appendChild(option);});const label=document.createElement('label');label.className='channel-control filter-control';label.textContent='分支过滤';label.appendChild(select);row.insertBefore(label,source.parentElement);select.onchange=()=>{config.projects[projectIndex].channels[channelIndex].branch_filter=select.value;};});};
function normalizeHarmony(){config.projects.forEach(p=>p.channels.forEach(c=>{if(c.platform==='HarmonyOS'){const suffix=(c.switch_to||'').endsWith('_release')?'release':'dev';c.switch_to='openharmony_'+suffix;c.name=c.switch_to;}}));}
const renderWithHarmony=render;render=function(){renderWithHarmony();document.querySelectorAll('[data-k="switch_to"] option').forEach(option=>{if(option.value.startsWith('harmony_')){option.value='openharmony_'+option.value.split('_',2)[1];option.textContent=option.value;}});};
function collect(){normalizeHarmony();config.id=document.querySelector('#agentId').value.trim();config.name=document.querySelector('#agentName').value.trim();}
async function load(){try{config=await fetch('/api/config').then(r=>r.json());normalizeHarmony();render();}catch(e){show('加载失败：'+e.message,true);}}
async function save(){collect();config.projects.forEach(p=>p.channels.forEach(c=>c.name=c.switch_to));try{const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});const result=await r.json();if(!r.ok||!result.ok)throw new Error(result.error||'HTTP '+r.status);show('配置保存成功');}catch(e){show('保存失败：'+e.message,true);}}
function show(text,error=false){const el=document.querySelector('#message');el.textContent=text;el.className='message '+(error?'error':'');}load();
</script></body></html>
