<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择 Unity 工程</title><style>body{margin:0;background:#0f172a;color:#dbeafe;font:14px system-ui;padding:24px}main{max-width:900px;margin:auto}.bar,.entry{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:12px;margin:8px 0}.path{color:#7dd3fc;word-break:break-all}.entry{display:flex;justify-content:space-between;align-items:center}.unity{border-color:#22c55e}.entry small{color:#86efac}button{border:0;border-radius:5px;padding:8px 12px;background:#38bdf8;cursor:pointer;margin-left:6px}.back{background:#64748b;color:#fff}</style></head>
<body><main><h1>选择 Unity 工程</h1><div class="bar"><div id="path" class="path">加载中...</div><button class="back" onclick="up()">上一级</button><button onclick="chooseCurrent()">选择当前目录</button></div><div id="entries"></div></main><script>
let current=new URLSearchParams(location.search).get('path')||'';
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(path=current){path=decodeURIComponent(path);const data=await fetch('/api/browse?path='+encodeURIComponent(path)).then(r=>r.json());current=data.path;document.querySelector('#path').textContent=data.path;document.querySelector('#entries').innerHTML=data.error?'<div class="bar">'+esc(data.error)+'</div>':data.entries.map(item=>`<div class="entry ${item.is_unity_project?'unity':''}"><span>${esc(item.name)} ${item.is_unity_project?'<small>Unity 工程</small>':''}</span><span>${item.is_unity_project?`<button onclick="selectProject('${encodeURIComponent(item.path)}')">选择</button>`:''}<button onclick="load('${encodeURIComponent(item.path)}')">打开</button></span></div>`).join('')||'<div class="bar">没有可进入的目录</div>';window.parentPath=data.parent;}
function up(){load(window.parentPath||'');}
function chooseCurrent(){selectProject(encodeURIComponent(current));}
async function selectProject(encoded){const path=decodeURIComponent(encoded);const draft=await fetch('/api/project-draft?path='+encodeURIComponent(path)).then(r=>r.json());if(draft.error){alert(draft.error);return;}if(window.opener){window.opener.postMessage({type:'ab2-project-selected',project:draft},location.origin);window.close();}else{location.href='/';}}
load();
</script></body></html>
